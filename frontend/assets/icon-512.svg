<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1b2140"/>
      <stop offset="100%" stop-color="#080b16"/>
    </radialGradient>
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b7a4ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#5599ff" stop-opacity="0.2"/>
    </linearGradient>
    <radialGradient id="planet" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#e8e0ff"/>
      <stop offset="45%" stop-color="#b7a4ff"/>
      <stop offset="100%" stop-color="#3d2a75"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="230" stroke="rgba(183,164,255,0.15)" stroke-width="2" fill="none"/>
  
  <!-- Outer Radio Wave Arcs -->
  <path d="M 120 180 A 180 180 0 0 1 392 180" fill="none" stroke="rgba(183,164,255,0.3)" stroke-width="4" stroke-dasharray="8 6"/>
  <path d="M 150 205 A 140 140 0 0 1 362 205" fill="none" stroke="rgba(183,164,255,0.5)" stroke-width="5"/>
  <path d="M 185 230 A 95 95 0 0 1 327 230" fill="none" stroke="#b7a4ff" stroke-width="6"/>

  <!-- Orbit Ring -->
  <ellipse cx="256" cy="280" rx="170" ry="50" fill="none" stroke="url(#orbitGrad)" stroke-width="6" transform="rotate(-22 256 280)"/>
  
  <!-- Central Planet / Beacon -->
  <circle cx="256" cy="280" r="54" fill="url(#planet)"/>
  
  <!-- Tiny Satellite in orbit -->
  <circle cx="390" cy="235" r="9" fill="#f3f5ff"/>
  <line x1="390" y1="235" x2="415" y2="225" stroke="#f3f5ff" stroke-width="2"/>
  <line x1="390" y1="235" x2="365" y2="245" stroke="#f3f5ff" stroke-width="2"/>

  <!-- Star accents -->
  <circle cx="100" cy="110" r="3" fill="#ffffff" opacity="0.8"/>
  <circle cx="410" cy="110" r="2" fill="#ffffff" opacity="0.6"/>
  <circle cx="90" cy="400" r="2.5" fill="#ffffff" opacity="0.7"/>
  <circle cx="420" cy="410" r="3" fill="#ffffff" opacity="0.9"/>
</svg>
